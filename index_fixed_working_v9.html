<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data:; script-src 'self' https://d3js.org 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' https: data:; connect-src 'self' https: data:; object-src 'none'; base-uri 'self';">
    <title>MusicGalaxy - Stabilized</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { margin: 0; background: #020202; color: #fff; font-family: 'Georgia', serif; overflow: hidden; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 100; width: 320px; background: rgba(0,0,0,0.9); padding: 18px; border: 1px solid #333; border-radius: 8px; max-height: calc(100vh - 40px); overflow-y: auto; }
        #track-title { color: #d4af37; font-weight: bold; margin-bottom: 10px; min-height: 40px; }
        svg { width: 100vw; height: 100vh; background-image: radial-gradient(#111 1px, transparent 1px); background-size: 50px 50px; }
        .tag-node { cursor: pointer; stroke: #000; stroke-width: 3px; paint-order: stroke; transition: opacity 0.3s; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        .active-node { animation: pulse 1.5s infinite; font-weight: bold !important; }
        button { background: #222; color: #ccc; border: 1px solid #444; padding: 5px 10px; cursor: pointer; margin-top: 5px; border-radius: 4px; }
        button:hover { background: #d4af37; color: #000; }
        button:disabled { opacity: 0.4; cursor: default; }
        button:disabled:hover { background: #222; color: #ccc; }
        #like-btn.liked { color: #ff5c7a; border-color: #ff5c7a; }
        .link-btn { background: none; border: none; padding: 0; margin: 0 0 0 6px; color: #9fb4c8; text-decoration: underline; font-size: 12px; }
        .link-btn:hover { background: none; color: #fff; }

        .chip { background:#151515; color:#ddd; border:1px solid #333; padding:3px 8px; border-radius:999px; font-size:12px; line-height:1.2; }
        .chip:hover { background:#d4af37; color:#000; }
        .chip-active { background:#d4af37; color:#000; border-color:#d4af37; }
    
        #search { width: 100%; padding: 10px; font-size: 18px; border-radius: 6px; border: 2px solid #d0a040; background: #0a0a0a; color: #fff; box-sizing: border-box; }
        #search-results { border: 1px solid #333; border-radius: 6px; padding: 8px; background: rgba(8,8,8,0.95); }
        .result-item { display: block; width: 100%; text-align: left; padding: 6px 8px; margin: 4px 0; border-radius: 6px; border: 1px solid #2a2a2a; background: rgba(255,255,255,0.04); color: #ddd; cursor: pointer; }
        .result-item:hover { background: rgba(255,255,255,0.08); }
        .result-meta { font-size: 12px; opacity: 0.75; margin-left: 6px; }

    </style>
</head>
<body>
<div id="ui">
    <input type="text" id="search" placeholder="Search..." style="width:100%; padding:8px; margin-bottom:10px; background:#111; border:1px solid #444; color:#fff;">
    <div id="search-results" style="margin-top:8px; display:none;"></div>    <div id="status-line" style="margin-top:6px; font-size:12px; opacity:0.75;"></div>
    <div id="track-title">Ready...</div>
    <div id="why-line" style="margin:-4px 0 8px 0; font-size:12px; color:#9fb4c8; line-height:1.35;"></div>
    <div id="mode-line" style="margin:6px 0 10px 0; font-size:12px; color:#aaa; line-height:1.3;">
        Mode: <span id="mode-name">random_walk</span><br>
        Active tag: <span id="active-tag">(none)</span>
    </div>
    <div id="tag-chips" style="margin:8px 0 10px 0; display:flex; flex-wrap:wrap; gap:6px;"></div>
    <audio id="player" controls style="width:100%; filter:invert(1); height:30px;"></audio>
    <div style="display:flex; flex-wrap:wrap; gap:5px; margin-top:10px;">
        <button onclick="setMode('pure_random')">Pure Random</button>
        <button onclick="setMode('random_walk')">Random Walk</button>
        <button onclick="setMode('within_tag')">Within Tag</button>
        <button onclick="setMode('spiral_time')">Spiral Time</button>
        <button onclick="setMode('teleport')">Teleport</button>
        <button onclick="setMode('radio')" title="Live internet radio for the active tag; press again for another station">Radio</button>
        <button onclick="skipTrack()" title="Next track now (in Radio mode: next station). Media key: Next">Skip ⏭</button>
        <button onclick="toggleLike()" id="like-btn" title="Like this artist: they and related artists come up more often">♡ Like</button>
        <button onclick="toggleAutoplay()" id="autoplay-btn">Autoplay: ON</button>
        <button onclick="resumeLast()">Resume Last</button>
        <button onclick="clearActiveTag()">Clear Tag</button>
        <button onclick="resetView()">Center View</button>
        <button onclick="toggleTaste()" id="taste-btn" title="Let your likes, skips and listens steer the picks">Taste: ON</button>
    </div>
    <div id="taste-line" style="margin-top:6px; font-size:12px; color:#aaa;"></div>
    <div id="source-chips" style="margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:12px; color:#aaa;"></div>
    </div>
<svg id="viz"></svg>
<div id="lod-hint" style="position:absolute; right:16px; bottom:12px; z-index:50; font-size:12px; color:#888; pointer-events:none;"></div>

<script>
    const svg = d3.select("#viz"), g = svg.append("g");
    let width = window.innerWidth, height = window.innerHeight; // updated on window resize
    const player = document.getElementById('player');
    let nodes = [], currentNode = null;
    let nodeById = new Map();
    let aliasToId = new Map();  // alias name -> canonical id (also resolves ids saved before entries were merged)

    // --- Autoplay controller ---
    let playMode = "random_walk";   // pure_random | random_walk | within_tag | spiral_time | teleport
    let autoplayEnabled = true;
    let activeTag = null;
    let spiralDir = +1;
    let modeBeforeTeleport = 'random_walk';

    // --- Playback request bookkeeping ---
    let playToken = 0;          // bumped on every playNode(); stale async results are dropped
    let skipTimer = null;       // pending "no recordings found" auto-skip
    let consecutiveFailures = 0;
    const MAX_CONSECUTIVE_FAILURES = 5; // stop auto-skipping (e.g. when offline)

    // --- Weighting state ---
    const plays = new Map();        // id -> count
    const lastPlayedAt = new Map(); // id -> epoch ms
    const RECENCY_HALF_LIFE_MS = 60 * 60 * 1000; // the "just played" penalty halves every hour
    const ROLE_MASTER_W = 1.6;  // masters are 1.6x as likely as an otherwise equal secondary artist
    const NEIGHBOURS = 12;      // most-similar artists kept per artist (random-walk pool, map links)
    // Bookkeeping labels in the data, not musical properties: ignored for similarity and tag chips
    const NON_MUSICAL_TAGS = new Set(['Secondary', 'Archive', 'Conductor']);
    const TAU = 0.12; // exploration temperature for softmax

    // --- Stabilized Physics & Center Gravity ---
const simulation = d3.forceSimulation()
    // Keep the map coherent instead of "exploding" into a ring.
    .force("charge", d3.forceManyBody().strength(-35))
    .force("center", d3.forceCenter(width / 2, height / 2))
    // x/y, collision, and link forces are configured after nodes load (need data-dependent targets).
    .alphaDecay(0.02);

let zoomK = 1; // current zoom level; decides how many names are shown
const zoom = d3.zoom().scaleExtent([0.1, 5]).on("zoom", (e) => {
    g.attr("transform", e.transform);
    zoomK = e.transform.k;
    updateVisibility();
});
svg.call(zoom);

function focusOnNode(node, scale=1.35, duration=650) {
    if (!node || node.x == null || node.y == null) return;
    const t = d3.zoomIdentity
        .translate(width / 2 - node.x * scale, height / 2 - node.y * scale)
        .scale(scale);
    svg.transition().duration(duration).call(zoom.transform, t);
}


    function setStatus(msg) {
        const el = document.getElementById('status-line');
        if (el) el.textContent = msg || '';
    }

    // ---------- Robust KB loading (fetch for http(s)/Electron file://, fs fallback) ----------
    // Parse with a readable error: git conflict markers or a truncated download are the usual culprits.
    function parseKnowledgeBase(raw, source) {
        if (/^(<<<<<<<|>>>>>>>) /m.test(raw)) {
            throw new Error(`${source}: contains git merge-conflict markers (<<<<<<<) — resolve or re-checkout the file`);
        }
        let data;
        try { data = JSON.parse(raw); }
        catch (e) { throw new Error(`${source}: not valid JSON (${e.message}; ${raw.length} bytes, starts with ${JSON.stringify(raw.slice(0, 20))})`); }
        if (!Array.isArray(data)) throw new Error(`${source}: expected a JSON array of entries`);
        return data;
    }

    async function loadKnowledgeBase(filename) {
        const failures = [];
        try {
            const res = await fetch(filename, { cache: 'no-store' });
            if (!res.ok) throw new Error(`fetch: HTTP ${res.status}`);
            const data = parseKnowledgeBase(await res.text(), 'fetch');
            setStatus(`Loaded ${data.length} entries`);
            return data;
        } catch (e) {
            failures.push(e.message);
        }
        try {
            if (window.require) {
                const fs = window.require('fs');
                const path = window.require('path');
                const { fileURLToPath } = window.require('url');
                // fileURLToPath handles Windows drive letters (file:///C:/... -> C:\...)
                const base = location.protocol === 'file:'
                    ? path.dirname(fileURLToPath(location.href))
                    : process.cwd();
                const full = path.join(base, filename);
                const data = parseKnowledgeBase(fs.readFileSync(full, 'utf-8'), full);
                setStatus(`Loaded ${data.length} entries (fs fallback)`);
                return data;
            }
            failures.push('fs fallback: unavailable (Node integration is off)');
        } catch (e2) {
            failures.push(`fs fallback: ${e2.message}`);
        }
        console.error('[kb] failed to load', filename, failures);
        setStatus(`Failed to load ${filename} — ${failures.join(' | ')}`);
        throw new Error(failures.join(' | '));
    }

    // ---------- Persistence ----------
    const LS = {
        lastNodeId: 'mg_lastNodeId',
        lastTrackSrc: 'mg_lastTrackSrc',
        lastTrackTitle: 'mg_lastTrackTitle',
        lastTrackVault: 'mg_lastTrackVault',
        lastTrackTime: 'mg_lastTrackTime',
        playMode: 'mg_playMode',
        activeTag: 'mg_activeTag',
        autoplayEnabled: 'mg_autoplayEnabled',
        sources: 'mg_sources'
    };

    function saveState() {
        try {
            if (currentNode?.id) localStorage.setItem(LS.lastNodeId, currentNode.id);
            localStorage.setItem(LS.playMode, playMode);
            localStorage.setItem(LS.activeTag, activeTag ?? '');
            localStorage.setItem(LS.autoplayEnabled, autoplayEnabled ? '1' : '0');
            localStorage.setItem(LS.sources, JSON.stringify(sources));
        } catch (e) {}
    }

    function updateUI() {
        const modeName = document.getElementById('mode-name');
        if (modeName) modeName.textContent = playMode;
        const tagEl = document.getElementById('active-tag');
        if (tagEl) tagEl.textContent = activeTag ?? '(none)';
        const btn = document.getElementById('autoplay-btn');
        if (btn) btn.textContent = autoplayEnabled ? 'Autoplay: ON' : 'Autoplay: OFF';
        updateTasteUI();
    }

    function resolveNode(name) {
        if (!name) return null;
        return nodeById.get(name) || nodeById.get(aliasToId.get(name)) || null;
    }

    // Render "[vault] title" without interpreting either as HTML (titles come from archive.org)
    function showTrack(title, vault) {
        const el = document.getElementById('track-title');
        if (!el) return;
        el.textContent = '';
        if (vault) {
            const v = document.createElement('span');
            v.style.color = '#66ccff';
            v.textContent = `[${vault}] `;
            el.appendChild(v);
        }
        el.appendChild(document.createTextNode(title || ''));
    }

    function restoreState() {
        try {
            const pm = localStorage.getItem(LS.playMode);
            if (pm && pm !== 'teleport') playMode = pm;
            const at = localStorage.getItem(LS.activeTag);
            activeTag = at ? at : null;
            const ap = localStorage.getItem(LS.autoplayEnabled);
            autoplayEnabled = (ap === null) ? true : (ap === '1');
            const src = JSON.parse(localStorage.getItem(LS.sources) || 'null');
            if (src && typeof src === 'object') {
                for (const k of Object.keys(sources)) if (typeof src[k] === 'boolean') sources[k] = src[k];
                if (!Object.values(sources).some(Boolean)) sources.archive = true;
            }
            updateUI();
        } catch (e) {}
    }

    function resumeLast() {
        try {
            const node = resolveNode(localStorage.getItem(LS.lastNodeId));
            if (!node) { setStatus('No last item'); return; }
            playToken++; // cancel any search still in flight
            clearTimeout(skipTimer);

            // restore exact track if available
            const src = localStorage.getItem(LS.lastTrackSrc);
            const title = localStorage.getItem(LS.lastTrackTitle);
            const vault = localStorage.getItem(LS.lastTrackVault);
            const t = parseFloat(localStorage.getItem(LS.lastTrackTime) || '0');

            currentNode = node;
            updateVisibility();
            d3.selectAll(".tag-node").classed("active-node", false);
            d3.selectAll(".tag-node").filter(d => d.id === node.id).classed("active-node", true);
            focusOnNode(node);
            renderTagChips(node);
            updateUI();

            if (src) {
                player.src = src;
                trackState = null;
                // currentTime can only be set once metadata is loaded
                player.addEventListener('loadedmetadata', () => {
                    // live radio streams have no finite duration and can't seek
                    if (Number.isFinite(player.duration)) player.currentTime = isFinite(t) ? t : 0;
                }, { once: true });
                showTrack(title || node.id, vault);
                player.play().catch(()=>{});
                setStatus('Resumed last track');
            } else {
                // fallback: search again
                playNode(node);
            }
        } catch (e) { console.error('[resume]', e); }
    }

    // ---------- Search wiring ----------
    function baseOpacity(d) { return d.is_master ? 1 : 0.6; }

    // ---------- Zoom-based visibility ----------
    // Masters are always shown. The other names appear in order of importance as you zoom in: the
    // first at LOD_FIRST_ZOOM, all of them by LOD_ALL_ZOOM. Importance = number of Wikipedia language
    // editions, with a head start for your curated artists over ones the build script added.
    // Always shown whatever the zoom: the artist playing, its closest artists, artists you liked and
    // search matches.
    const LOD_FIRST_ZOOM = 0.8;
    const LOD_ALL_ZOOM = 3;
    const CURATED_BONUS = 1.5;
    let searchQuery = '';

    function computeImportance() {
        const importance = n => (n.sitelinks || 0) * (n.source === 'wikidata' ? 1 : CURATED_BONUS);
        const others = nodes.filter(n => !n.is_master).sort((a, b) => importance(b) - importance(a));
        for (const n of nodes) if (n.is_master) n._minZoom = 0;
        others.forEach((n, i) => {
            n._minZoom = LOD_FIRST_ZOOM + (LOD_ALL_ZOOM - LOD_FIRST_ZOOM) * (others.length > 1 ? i / (others.length - 1) : 0);
        });
    }

    let visibilityQueued = false;
    function updateVisibility() {
        if (visibilityQueued) return; // at most once per frame while zooming
        visibilityQueued = true;
        requestAnimationFrame(() => {
            visibilityQueued = false;
            const context = new Set(currentNode ? [currentNode, ...(currentNode._neighbours || []).map(x => x.node)] : []);
            for (const n of likedNodes()) context.add(n);
            const opacity = d => {
                const zoomed = zoomK >= (d._minZoom ?? 0) || context.has(d);
                if (searchQuery) return matchesQuery(d, searchQuery) ? 1 : (zoomed ? 0.08 : 0);
                return zoomed ? baseOpacity(d) : 0;
            };
            let shown = 0;
            d3.selectAll('.tag-node').each(function (d) {
                const o = opacity(d);
                if (o > 0) shown++;
                this.style.opacity = o;
                this.style.pointerEvents = o > 0 ? 'all' : 'none'; // hidden names can't be clicked
            });
            const hint = document.getElementById('lod-hint');
            if (hint) hint.textContent = shown < nodes.length
                ? `${shown} of ${nodes.length} names · zoom in for more` : `all ${nodes.length} names`;
        });
    }

    function matchesQuery(n, q) {
        return (n.id || '').toLowerCase().includes(q)
            || (n.aliases || []).some(a => (a || '').toLowerCase().includes(q))
            || (n.tags || []).some(t => (t || '').toLowerCase().includes(q));
    }

    function wireSearch() {
        const inp = document.getElementById('search');
        const box = document.getElementById('search-results');
        if (!inp || !box) return;

        function renderResults(list) {
            box.innerHTML = '';
            if (!list.length) { box.style.display = 'none'; return; }
            box.style.display = 'block';
            list.slice(0, 10).forEach(n => {
                const b = document.createElement('button');
                b.className = 'result-item';
                const meta = document.createElement('span');
                meta.className = 'result-meta';
                meta.textContent = `${n.type} · ${n.era ?? ''}${n.is_master ? ' · master' : ''}`;
                b.append(n.id + ' ', meta);
                b.onclick = () => { inp.value = n.id; box.style.display='none'; playNode(n); };
                box.appendChild(b);
            });
        }

        inp.addEventListener('input', () => {
            const q = (inp.value || '').trim().toLowerCase();
            searchQuery = q;
            updateVisibility(); // matches are shown at any zoom, the rest dimmed
            if (!q) { renderResults([]); return; }
            const hits = nodes.filter(n => matchesQuery(n, q));
            hits.sort((a,b) => (b.is_master?1:0) - (a.is_master?1:0));
            renderResults(hits);
        });

        inp.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const q = (inp.value || '').trim().toLowerCase();
                const hit = nodes.find(n => n.id.toLowerCase() === q)
                    || nodes.find(n => (n.aliases || []).some(a => a.toLowerCase() === q))
                    || nodes.find(n => n.id.toLowerCase().includes(q));
                if (hit) { box.style.display='none'; playNode(hit); }
            }
            if (e.key === 'Escape') box.style.display='none';
        });
    }

    // Era -> x; relatedness position (_ry, 0-1) -> y; within the current window size
    function computeLayoutTargets() {
        const eraExtent = d3.extent(nodes, d => +d.era || 1800);
        const xScale = d3.scaleLinear().domain(eraExtent).range([width * 0.18, width * 0.82]);
        const yScale = d3.scaleLinear().domain([0, 1]).range([height * 0.85, height * 0.15]);
        for (const n of nodes) {
            n._tx = xScale(+n.era || 1800) + (n._jx || 0);
            n._ty = yScale(Number.isFinite(n._ry) ? n._ry : 0.5) + (n._jy || 0);
        }
    }

    // For every artist: its NEIGHBOURS most related artists (playback, map links), and its most
    // style-related artists ignoring time (vertical layout). One O(n^2) pass at start-up.
    function computeNeighbours() {
        const keepTop = (list, item, k) => {
            if (list.length < k) { list.push(item); if (list.length === k) list.sort((a, b) => a.sim - b.sim); return; }
            if (item.sim <= list[0].sim) return;
            list[0] = item;
            for (let i = 0; i + 1 < list.length && list[i].sim > list[i + 1].sim; i++) [list[i], list[i + 1]] = [list[i + 1], list[i]];
        };
        for (const n of nodes) { n._neighbours = []; n._styleNeighbours = []; }
        for (let i = 0; i < nodes.length; i++) {
            const a = nodes[i];
            for (let j = i + 1; j < nodes.length; j++) {
                const b = nodes[j];
                const sim = similarity(a, b);
                keepTop(a._neighbours, { node: b, sim }, NEIGHBOURS);
                keepTop(b._neighbours, { node: a, sim }, NEIGHBOURS);
                const style = styleRelatedness(a, b);
                if (style > 0) {
                    keepTop(a._styleNeighbours, { node: b, sim: style }, 10);
                    keepTop(b._styleNeighbours, { node: a, sim: style }, 10);
                }
            }
        }
        for (const n of nodes) {
            n._neighbours.sort((a, b) => b.sim - a.sim);
            n._styleNeighbours.sort((a, b) => b.sim - a.sim);
        }
    }

    // Vertical position from relatedness: order artists so that related ones sit at similar heights
    // (spectral ordering - the Fiedler vector of the style-neighbour graph), spread 0-1.
    // Related artists tend to be contemporaries, so the ordering is kept independent of era (the x
    // axis already shows time): the vertical axis shows what relates artists beyond when they lived.
    function computeRelatednessAxis() {
        const n = nodes.length;
        if (n < 3) { nodes.forEach((d, i) => d._ry = n > 1 ? i / (n - 1) : 0.5); return; }
        const index = new Map(nodes.map((d, i) => [d, i]));
        const nbrs = nodes.map(() => new Map());
        nodes.forEach((d, i) => {
            for (const { node, sim } of d._styleNeighbours || []) {
                const j = index.get(node);
                const w = Math.max(sim, nbrs[i].get(j) || 0);
                nbrs[i].set(j, w); nbrs[j].set(i, w);
            }
        });
        const deg = nbrs.map(m => [...m.values()].reduce((a, b) => a + b, 0));
        const c = 2 * Math.max(...deg) + 1e-9;
        let seed = 12345; // fixed seed: the same data always gives the same map
        const rand = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
        let v = nodes.map(() => rand() - 0.5);
        // centred, normalised era vector to project out (time is the x axis)
        const eras = nodes.map(d => Number.isFinite(+d.era) ? +d.era : 1800);
        const eraMean = eras.reduce((a, b) => a + b, 0) / n;
        let eraVec = eras.map(e => e - eraMean);
        const eraNorm = Math.sqrt(eraVec.reduce((a, b) => a + b * b, 0)) || 1;
        eraVec = eraVec.map(x => x / eraNorm);
        for (let it = 0; it < 3000; it++) {
            // power iteration on (c*I - Laplacian), keeping v orthogonal to the constant vector
            const next = new Array(n);
            for (let i = 0; i < n; i++) {
                let lv = deg[i] * v[i];
                for (const [j, w] of nbrs[i]) lv -= w * v[j];
                next[i] = c * v[i] - lv;
            }
            const mean = next.reduce((a, b) => a + b, 0) / n;
            for (let i = 0; i < n; i++) next[i] -= mean;
            let dot = 0;
            for (let i = 0; i < n; i++) dot += next[i] * eraVec[i];
            let norm = 0;
            for (let i = 0; i < n; i++) { next[i] -= dot * eraVec[i]; norm += next[i] * next[i]; }
            norm = Math.sqrt(norm) || 1;
            v = next.map(x => x / norm);
        }
        // Stable orientation: opera towards the top
        const opera = nodes.reduce((acc, d, i) => acc + ((d.tags || []).includes('Opera') ? v[i] : 0), 0);
        if (opera < 0) v = v.map(x => -x);
        // Height = position among contemporaries (artists within ~40 years, at least 25 of them), so
        // within any period related artists sit together but no period as a whole sits higher
        const byEra = nodes.map((d, i) => i).sort((a, b) => eras[a] - eras[b]);
        for (let i = 0; i < n; i++) {
            let window = byEra.filter(j => Math.abs(eras[j] - eras[i]) <= 40);
            if (window.length < 25) {
                window = byEra.slice().sort((a, b) => Math.abs(eras[a] - eras[i]) - Math.abs(eras[b] - eras[i])).slice(0, 25);
            }
            let below = 0, same = 0;
            for (const j of window) { if (v[j] < v[i]) below++; else if (v[j] === v[i]) same++; }
            nodes[i]._ry = window.length > 1 ? (below + (same - 1) / 2) / (window.length - 1) : 0.5;
        }
    }

    // Keep the map filling the window when it's resized
    let resizeTimer = null;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            width = window.innerWidth;
            height = window.innerHeight;
            if (!nodes.length) return;
            computeLayoutTargets();
            simulation.force('center', d3.forceCenter(width / 2, height / 2));
            simulation.force('x').x(d => d._tx);
            simulation.force('y').y(d => d._ty);
            simulation.alpha(0.5).restart();
        }, 200);
    });

async function init() {
    nodes = await loadKnowledgeBase('knowledge_base.json');
    nodeById = new Map(nodes.map(n => [n.id, n]));
    aliasToId = new Map();
    for (const n of nodes) for (const a of (n.aliases || [])) aliasToId.set(a, n.id);

    // Names to query archive.org with: the canonical id plus aliases that can't be confused
    // with another entry (e.g. skip "Mozart" because "Leopold Mozart" also exists).
    const surnameOwners = new Map();
    for (const n of nodes) {
        const last = String(n.id).split(/\s+/).pop().toLowerCase();
        surnameOwners.set(last, (surnameOwners.get(last) || 0) + 1);
    }
    for (const n of nodes) {
        n._searchNames = [n.id, ...(n.aliases || []).filter(a => /\s/.test(a) || (surnameOwners.get(a.toLowerCase()) || 0) <= 1)];
    }
    
    // Relatedness: documented links (if relations.json exists) + context, tags and era
    const relations = await loadRelations('relations.json');
    prepareRelatedness();
    computeNeighbours();
    computeRelatednessAxis();
    computeImportance();
    setStatus(relations
        ? `Loaded ${nodes.length} artists · ${relationEdges.size} documented relations (built ${relations.built || '?'})`
        : `Loaded ${nodes.length} artists · no relations.json yet: run tools/build_relations.py for richer links`);

    // Layout targets: era left-to-right, relatedness bottom-to-top, plus a fixed random jitter per node
    for (const n of nodes) {
        n._jx = (Math.random() - 0.5) * 120;
        n._jy = (Math.random() - 0.5) * 40;
    }
    computeLayoutTargets();
    for (const n of nodes) {
        // start near targets to avoid the "ring" artifact
        n.x = n._tx;
        n.y = n._ty;
    }

    // Links between each artist and its most similar artists (same measure as the playback modes)
    const linkPairs = new Set();
    const links = [];
    for (const n of nodes) {
        for (const { node: m, sim } of n._neighbours.slice(0, 8)) {
            const key = n.id < m.id ? n.id + '||' + m.id : m.id + '||' + n.id;
            if (linkPairs.has(key)) continue;
            linkPairs.add(key);
            links.push({ source: n, target: m, w: sim });
        }
    }

    // Configure simulation forces now that we have targets + links
    simulation.nodes(nodes);

    const linkForce = d3.forceLink(links)
        .distance(l => 55 + (1 - (l.w || 0.3)) * 65)
        .strength(l => Math.max(0.05, Math.min(0.22, 0.08 + (l.w || 0.3) * 0.18)));

    simulation
        .force("x", d3.forceX(d => d._tx).strength(0.22))
        .force("y", d3.forceY(d => d._ty).strength(0.22))
        .force("collision", d3.forceCollide().radius(d => 10 + Math.min(18, (d.id || "").length * 0.6)).iterations(2))
        .force("link", linkForce)
        .alpha(1)
        .restart();

    const nodeElements = g.selectAll(".tag-node")
        .data(nodes)
        .enter().append("text")
        .attr("class", d => d.is_master ? "tag-node master" : "tag-node")
        .text(d => d.id)
        .attr("text-anchor", "middle")
        .attr("dominant-baseline", "central") // Centers text vertically on its coordinate
        .attr("font-size", d => d.is_master ? "20px" : "14px")
        .attr("font-weight", d => d.is_master ? "700" : "400")
        .attr("fill", d => {
            if (d.type === "Singer") return "#ff66cc";   // Pink
            if (d.type === "Instrumentalist") return "#7ddc8a"; // Green
            if (d.type === "Conductor") return "#66ccff"; // Blue
            return "#d4af37";                             // Gold
        })
        .on("click", (e, d) => playNode(d));
    loadTaste();
    updateVisibility();

    simulation.nodes(nodes).on("tick", () => {
        nodeElements
            .attr("x", d => d.x || width / 2)
            .attr("y", d => d.y || height / 2);
    });

    // Restore persisted mode/tag/autoplay/sources and wire up search UI
    restoreState();
    renderSourceChips();
    wireSearch();

    // Focus last played node (no autoplay) and show last track title if available
    try {
        const n = resolveNode(localStorage.getItem(LS.lastNodeId));
        if (n) {
            currentNode = n;
            d3.selectAll(".tag-node").classed("active-node", false);
            d3.selectAll(".tag-node").filter(d => d.id === n.id).classed("active-node", true);
            focusOnNode(n, 1.35, 650);
            renderTagChips(n);
            updateVisibility();

            const title = localStorage.getItem(LS.lastTrackTitle);
            const vault = localStorage.getItem(LS.lastTrackVault);
            if (title) showTrack(title, vault);
        }
    } catch (e) { console.error('[restore]', e); }
}

    // --- UI helpers ---
    function setMode(mode) {
        // Teleport is a one-shot jump; afterwards autoNext() returns to the previous mode
        if (mode === 'teleport' && playMode !== 'teleport') modeBeforeTeleport = playMode;
        const previous = playMode;
        playMode = mode;
        updateUI();
        saveState();

        // A new mode normally takes effect when the current track ends. Teleport (a deliberate jump)
        // and Radio switch straight away, and so does leaving Radio, since a live stream never ends.
        const playing = !!currentNode && !player.paused && !player.ended;
        if (mode === 'teleport' || mode === 'radio' || previous === 'radio' || (currentNode && !playing)) {
            autoNext();
        } else if (playing && mode !== previous) {
            setStatus('New mode starts after this track (Skip to start it now)');
        }
    }

    // Move on now: the next pick in the current mode, or the next station in Radio mode
    function skipTrack() {
        if (playMode !== 'radio' && !currentNode) { setStatus('Pick an artist first'); return; }
        setStatus('');
        // Skipping a track you've just started hearing says you didn't want it (a track that never
        // started - still searching, or failed - says nothing)
        if (trackState?.started && !trackState.counted && player.currentTime < TASTE.quickSkipSec) {
            trackState.counted = true;
            recordTaste(trackState.node, 'skips');
        }
        // Stop the current track (or station) now: otherwise it plays on while the next one is looked
        // up, and if it ends meanwhile, autoplay would skip a second time
        player.pause();
        autoNext();
    }

    // The keyboard's "next track" media key does the same
    try {
        navigator.mediaSession?.setActionHandler('nexttrack', skipTrack);
    } catch (e) { /* not supported */ }

    function toggleAutoplay() {
        autoplayEnabled = !autoplayEnabled;
        updateUI();
        saveState();
    }

    function setActiveTag(tag) {
        activeTag = tag;
        updateUI();
        saveState();
        if (currentNode) renderTagChips(currentNode);
        if (playMode === 'radio' && tag) autoNext();
        else if (currentNode && playMode === 'within_tag') autoNext();
    }

    function clearActiveTag() {
        setActiveTag(null);
    }

    function renderTagChips(node) {
        const wrap = document.getElementById('tag-chips');
        if (!wrap) return;
        wrap.innerHTML = '';
        const tags = (node?.tags ?? []).filter(t => !NON_MUSICAL_TAGS.has(t)).slice(0, 24);
        for (const t of tags) {
            const b = document.createElement('button');
            b.textContent = t;
            b.className = 'chip' + ((activeTag && t === activeTag) ? ' chip-active' : '');
            b.onclick = () => setActiveTag(t);
            wrap.appendChild(b);
        }
    }

    function resetView() {
        if (currentNode) {
            focusOnNode(currentNode, 1.25, 650);
        } else {
            svg.transition().duration(650).call(zoom.transform, d3.zoomIdentity);
        }
    }

    // ---------- Recording sources ----------
    // archive  – archive.org, excluding 78 rpm transfers; also matches Musopen's uploads
    // commons  – Wikimedia Commons (free/public-domain audio files)
    // historic – archive.org 78 rpm transfers (Great 78 Project etc.): mono, surface noise
    const SOURCE_LABELS = { archive: 'archive.org', commons: 'Wikimedia Commons', historic: '78 rpm (historic)' };
    let sources = { archive: true, commons: true, historic: true };
    const HISTORIC_COLLECTIONS = ['georgeblood', '78rpm', '78rpm_opera'];
    const COMMONS_API = 'https://commons.wikimedia.org/w/api.php';
    const API_USER_AGENT = 'MusicGalaxy/0.1 (https://github.com/ravbag/musicgalaxy)';
    const MIN_TRACK_SECONDS = 45;   // skip clips, pronunciations, jingles
    const TIER_GOOD = 2;            // VBR/high-bitrate lossy or better
    const ARCHIVE_ITEMS_TO_TRY = 3; // look at a few items for a well-encoded one

    function renderSourceChips() {
        const wrap = document.getElementById('source-chips');
        if (!wrap) return;
        wrap.textContent = 'Sources:';
        for (const key of Object.keys(SOURCE_LABELS)) {
            const b = document.createElement('button');
            b.className = 'chip' + (sources[key] ? ' chip-active' : '');
            b.textContent = SOURCE_LABELS[key];
            b.title = sources[key] ? 'Click to stop using this source' : 'Click to use this source';
            b.onclick = () => {
                const next = { ...sources, [key]: !sources[key] };
                if (!Object.values(next).some(Boolean)) { setStatus('Keep at least one source on'); return; }
                sources = next;
                saveState();
                renderSourceChips();
            };
            wrap.appendChild(b);
        }
    }

    // Try the better-sounding sources first (in random order, for variety) and 78s last.
    // Performers active before ~1950 mostly survive on 78s, so those go first for them.
    function sourceOrder(node) {
        const early78 = node.type !== 'Composer' && (+node.era || 2000) < 1950;
        const good = Math.random() < 0.5 ? ['archive', 'commons'] : ['commons', 'archive'];
        const order = early78 ? ['historic', ...good] : [...good, 'historic'];
        return order.filter(k => sources[k]);
    }

    async function fetchJson(url, options) {
        const res = await fetch(url, options);
        if (!res.ok) throw new Error(`HTTP ${res.status} for ${url}`);
        return res.json();
    }

    function shuffled(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function firstText(v) { return String((Array.isArray(v) ? v[0] : v) ?? '').trim(); }

    // Commons metadata values are HTML; DOMParser doesn't run scripts, so this is safe
    function htmlToText(html) {
        if (!html) return '';
        return (new DOMParser().parseFromString(String(html), 'text/html').body.textContent || '').trim();
    }

    // "183.4" or "3:03" -> seconds
    function parseLength(v) {
        if (v == null || v === '') return NaN;
        const str = String(v);
        return str.includes(':') ? str.split(':').reduce((acc, part) => acc * 60 + Number(part), 0) : Number(str);
    }

    // How good an archive.org file's encoding is (0 = unplayable)
    function formatTier(f) {
        const name = (f.name || '').toLowerCase();
        const fmt = (f.format || '').toLowerCase();
        if (!/\.(mp3|flac|ogg|oga|opus|m4a|wav)$/.test(name)) return 0;
        if (fmt.includes('flac') || name.endsWith('.flac')) return 4;
        if (fmt.includes('apple lossless') || fmt.includes('wave') || name.endsWith('.wav')) return 3;
        if (/(16|24|32|48|64)kbps/.test(fmt)) return 0.5;
        if (/128kbps/.test(fmt)) return 1;
        if (/vbr|320|256|192|vorbis|opus/.test(fmt)) return 2;
        return 1;
    }

    // Group an item's files into tracks (an original plus its derivatives), drop short clips,
    // pick a random track and its best encoding.
    function pickArchiveTrack(files) {
        const tracks = new Map();
        for (const f of files) {
            if (typeof f?.name !== 'string' || /(_sample|spectrogram)/i.test(f.name)) continue;
            const tier = formatTier(f);
            if (!tier) continue;
            const base = (f.source === 'derivative' && f.original) ? f.original : f.name;
            const key = base.replace(/\.[^./]+$/, '');
            const t = tracks.get(key) || { best: null, length: NaN, title: '' };
            if (!t.best || tier > formatTier(t.best)) t.best = f;
            const len = parseLength(f.length);
            if (Number.isFinite(len)) t.length = Math.max(Number.isFinite(t.length) ? t.length : 0, len);
            t.title = t.title || firstText(f.title);
            tracks.set(key, t);
        }
        const usable = [...tracks.values()].filter(t => !(t.length < MIN_TRACK_SECONDS));
        if (!usable.length) return null;
        const t = usable[Math.floor(Math.random() * usable.length)];
        return { file: t.best, tier: formatTier(t.best), title: t.title };
    }

    function archiveNameClause(node) {
        const names = (node._searchNames || [node.id]).map(n => String(n).replace(/"/g, ''));
        // description: is left out: it matches any record that merely mentions the name
        const fields = node.type === 'Composer' ? ['creator', 'subject', 'title']
            : node.type === 'Singer' ? ['creator', 'performer', 'subject', 'title']
            : node.type === 'Conductor' ? ['creator', 'subject', 'title']
            : node.type === 'Instrumentalist' ? ['creator', 'performer', 'subject', 'title']
            : ['creator', 'title'];
        return '(' + names.flatMap(name => fields.map(f => `${f}:"${name}"`)).join(' OR ') + ')';
    }

    async function findArchiveTrack(node, historic, isCurrent) {
        const quoted = list => list.map(c => `"${c}"`).join(' OR ');
        let scope;
        if (historic) {
            scope = `collection:(${quoted(HISTORIC_COLLECTIONS)})`;
        } else {
            const own = (node.collections || []).filter(c => !HISTORIC_COLLECTIONS.includes(c));
            // Musopen's modern public-domain recordings are on archive.org; match them wherever they're filed
            const where = own.length ? `(collection:(${quoted(own)}) OR musopen)` : 'musopen';
            scope = `${where} AND NOT collection:(${quoted(HISTORIC_COLLECTIONS)})`;
        }
        const query = `${archiveNameClause(node)} AND ${scope} AND mediatype:audio`;
        const url = `https://archive.org/advancedsearch.php?q=${encodeURIComponent(query)}&fl[]=identifier&rows=50&page=1&output=json&sort[]=-downloads`;
        const data = await fetchJson(url);
        if (!isCurrent()) return null;

        let best = null;
        for (const doc of shuffled(data?.response?.docs || []).slice(0, ARCHIVE_ITEMS_TO_TRY)) {
            const id = doc.identifier;
            const meta = await fetchJson(`https://archive.org/metadata/${encodeURIComponent(id)}`);
            if (!isCurrent()) return null;
            const pick = pickArchiveTrack(Array.isArray(meta?.files) ? meta.files : []);
            if (!pick) continue;
            const path = pick.file.name.split('/').map(encodeURIComponent).join('/');
            const coll = firstText(meta?.metadata?.collection);
            const candidate = {
                src: `https://archive.org/download/${encodeURIComponent(id)}/${path}`,
                title: pick.title || firstText(meta?.metadata?.title) || pick.file.name,
                label: historic ? `78 rpm · ${coll || 'archive.org'}` : `archive.org${coll ? ' · ' + coll : ''}`,
                tier: pick.tier,
            };
            if (!best || candidate.tier > best.tier) best = candidate;
            if (candidate.tier >= TIER_GOOD) break;
        }
        return best;
    }

    // Wikimedia Commons: full-text search over audio files that mention the artist
    // Spoken content: talks, concert introductions, interviews, lectures, podcasts. Only words that
    // clearly mean speech (not "introduction", which is common in music titles: Introduction and Allegro)
    // "Concert introduction" and German/Dutch compounds (Konzerteinführung, concertinleiding) are matched
    // as such, so the plain word "introduction" can stay allowed.
    const SPEECH_WORDS = /\b(spoken|pronunciation|interviews?|lectures?|podcasts?|speech(es)?|talk show|discussion|conversation|audio ?guide|radio (programme|program|show)|concert introductions?|pre-?concert talks?|\w*inleiding(en)?|toelichting|lezing|gesprek|voordracht|\w*einf(ü|ue)hrung(en)?|vortrag|gespr(ä|ae)ch|diskussion|conf(é|e)rence|entretien|causerie)\b/i;
    // Categories that mark a file as music ("Audio files of music by ...", "Symphonies by ...", ...)
    const MUSIC_CATEGORY = /music|musique|musik|muziek|m(ú|u)sica|symphon|concert|sonata|quartet|opera|aria|lieder|song|piano|organ|orchestra|choir|choral|cantata|mass(es)? by|requiem|composition|works by/i;

    function commonsText(ii) {
        const em = ii.extmetadata || {};
        return {
            description: htmlToText(em.ImageDescription?.value) + ' ' + htmlToText(em.ObjectName?.value),
            categories: String(em.Categories?.value || ''),
        };
    }

    function isMusicFile(title, ii) {
        const mime = ii.mime || '';
        if (!(ii.mediatype === 'AUDIO' || mime.startsWith('audio/'))) return false;
        if (/midi/i.test(mime)) return false;
        // Pronunciation clips ("File:De-Bach.ogg", "File:LL-Q150 ...") and spoken content
        if (/^File:(LL-|[A-Z][a-z]{1,2}(-[a-z]{2,3})?-)/.test(title)) return false;
        const { description, categories } = commonsText(ii);
        if (SPEECH_WORDS.test(title) || SPEECH_WORDS.test(description) || SPEECH_WORDS.test(categories)) return false;
        const meta = Array.isArray(ii.metadata) ? ii.metadata : [];
        const lenEntry = meta.find(m => m && (m.name === 'length' || m.name === 'playtime_seconds'));
        const len = lenEntry ? Number(lenEntry.value) : NaN;
        if (Number.isFinite(len)) return len >= MIN_TRACK_SECONDS;
        return (ii.size || 0) >= 500000;
    }

    async function findCommonsTrack(node, isCurrent) {
        const params = new URLSearchParams({
            action: 'query', format: 'json', formatversion: '2', origin: '*',
            generator: 'search', gsrsearch: `"${String(node.id).replace(/"/g, '')}" filetype:audio`,
            gsrnamespace: '6', gsrlimit: '50',
            prop: 'imageinfo', iiprop: 'url|mime|size|mediatype|metadata|extmetadata',
            iiextmetadatafilter: 'ObjectName|Artist|LicenseShortName|ImageDescription|Categories',
        });
        const data = await fetchJson(`${COMMONS_API}?${params}`, { headers: { 'Api-User-Agent': API_USER_AGENT } });
        if (!isCurrent()) return null;
        const pages = Array.isArray(data?.query?.pages) ? data.query.pages : Object.values(data?.query?.pages || {});
        const candidates = pages.filter(p => p?.imageinfo?.[0]?.url && isMusicFile(p.title || '', p.imageinfo[0]));
        if (!candidates.length) return null;
        // Prefer files categorised as music; others only if there are none
        const music = candidates.filter(p => MUSIC_CATEGORY.test(commonsText(p.imageinfo[0]).categories));
        const pool = music.length ? music : candidates;
        const page = pool[Math.floor(Math.random() * pool.length)];
        const ii = page.imageinfo[0];
        const em = ii.extmetadata || {};
        const title = htmlToText(em.ObjectName?.value) || String(page.title).replace(/^File:/, '').replace(/\.[^.]+$/, '');
        const artist = htmlToText(em.Artist?.value).slice(0, 80);
        const license = htmlToText(em.LicenseShortName?.value);
        return {
            src: ii.url,
            title: artist ? `${title} · ${artist}` : title,
            label: `Wikimedia Commons${license ? ' · ' + license : ''}`,
        };
    }

    function setWhy(text) {
        const el = document.getElementById('why-line');
        if (el) el.textContent = text || '';
    }

    // The "why" line: how the next artist connects to the previous one, and which mode chose it
    function describeChoice(node, reason, previous) {
        const from = reason?.from || previous;
        const link = from && from !== node ? explain(from, node) : [];
        const linkText = link.length ? `from ${from.id}: ${link.join(' · ')}` : (from && from !== node ? `no close link to ${from.id}` : '');
        switch (reason?.mode) {
            case 'pure_random': return 'Pure random pick';
            case 'teleport': return `Teleport: a deliberate jump away from ${from?.id ?? 'the last artist'}`;
            case 'within_tag': return `Within ${reason.tag}` + (linkText ? ` · ${linkText}` : '');
            case 'spiral_time': return `Spiral Time, towards ~${reason.target}` + (linkText ? ` · ${linkText}` : '');
            case 'random_walk': return linkText ? `Random walk ${linkText}` : 'Random walk';
            default: return linkText ? `Link ${linkText}` : '';
        }
    }

    function startTrack(node, track, prefix = `${node.id} — `) {
        player.src = track.src;
        // Radio streams belong to a genre, not to the artist: they teach the taste nothing
        trackState = playMode === 'radio' ? null : { node, started: false, counted: false };
        const title = `${prefix}${track.title}`;
        try {
            if (nodeById.has(node.id)) localStorage.setItem(LS.lastNodeId, node.id);
            localStorage.setItem(LS.lastTrackSrc, player.src);
            localStorage.setItem(LS.lastTrackTitle, title);
            localStorage.setItem(LS.lastTrackVault, track.label);
            localStorage.setItem(LS.lastTrackTime, '0');
        } catch (e) {}
        saveState();
        player.play().catch(e => console.warn('[play]', e));
        showTrack(title, track.label);
    }

    // reason (optional): { mode, from, tag, target } from autoNext(), shown on the "why" line
    async function playNode(node, reason) {
        const token = ++playToken;
        const isCurrent = () => token === playToken;
        clearTimeout(skipTimer);
        const previous = currentNode;
        currentNode = node;
        trackState = null;
        updateVisibility();
        updateTasteUI();
        const tasteNote = reason && reason.mode !== 'pure_random' ? tasteReason(node) : '';
        setWhy(playMode === 'radio' ? '' : [describeChoice(node, reason, previous), tasteNote].filter(Boolean).join(' · '));
        d3.selectAll(".tag-node").classed("active-node", false);
        d3.selectAll(".tag-node").filter(d => d.id === node.id).classed("active-node", true);

        focusOnNode(node);

        const trackDisplay = document.getElementById('track-title');

        // Update play counters
        plays.set(node.id, (plays.get(node.id) || 0) + 1);
        lastPlayedAt.set(node.id, Date.now());
        recentPicks.push(node.id);
        if (recentPicks.length > RECENT_EXCLUDED) recentPicks.shift();

        // Update UI
        renderTagChips(node);
        updateUI();

        // Radio mode: clicking an artist tunes to a station in their genres
        if (playMode === 'radio') return playRadio(node, null, token);

        for (const source of sourceOrder(node)) {
            trackDisplay.innerText = `Searching ${SOURCE_LABELS[source]}...`;
            try {
                const track = source === 'commons'
                    ? await findCommonsTrack(node, isCurrent)
                    : await findArchiveTrack(node, source === 'historic', isCurrent);
                if (!isCurrent()) return; // superseded by a newer request
                if (track) { startTrack(node, track); return; }
            } catch (e) {
                if (!isCurrent()) return;
                console.warn('[search]', source, e);
            }
        }
        if (!isCurrent()) return;
        handlePlaybackFailure('No recordings found.');
    }

    // Skip to the next node after a failure, unless autoplay is off or we keep failing (e.g. offline)
    function handlePlaybackFailure(reason) {
        consecutiveFailures += 1;
        const trackDisplay = document.getElementById('track-title');
        if (!autoplayEnabled) {
            trackDisplay.innerText = reason;
            return;
        }
        if (consecutiveFailures >= MAX_CONSECUTIVE_FAILURES) {
            trackDisplay.innerText = `${reason} Stopped after ${consecutiveFailures} failures in a row — check your connection.`;
            consecutiveFailures = 0;
            return;
        }
        trackDisplay.innerText = `${reason} Skipping...`;
        const token = playToken;
        skipTimer = setTimeout(() => { if (token === playToken) autoNext(); }, 2000);
    }

    // ---------- Radio mode (Radio Browser: community directory of internet radio stations) ----------
    // Map the knowledge base's style tags to Radio Browser tags (tried in order). Nationality and
    // role tags ("French", "Conductor", ...) are left out: on radio they mean language/pop stations.
    const RADIO_TAGS = {};
    for (const [radioTags, ourTags] of [
        [['early music', 'medieval', 'renaissance'], ['Medieval', 'Early Music', 'Ars Nova', 'Notre Dame School', 'Polyphony', 'Franco-Flemish', 'Renaissance', 'Motet']],
        [['baroque', 'early music'], ['Baroque', 'Early Baroque', 'Bach', 'Harpsichord', 'Venetian School', 'Counterpoint', 'Historically Informed']],
        [['classical'], ['Classical', 'First Viennese School', 'Mannheim School', 'Classic']],
        [['romantic', 'classical'], ['Romantic', 'Late Romantic', 'Nationalist', 'New German School', 'Russian Five', 'Tone Poem', 'Programmatic', 'Lieder', 'Virtuoso']],
        [['opera'], ['Opera', 'Bel Canto', 'Verismo', 'Operetta', 'Wagnerian', 'Wagner', 'Verdi', 'Soprano', 'Tenor', 'Mezzo', 'Baritone', 'Bass', 'Bass-Baritone', 'Countertenor', 'Coloratura', 'Spinto', 'Lyric', 'Dramatic', 'Contralto', 'Opera Reform']],
        [['choral', 'sacred', 'gregorian'], ['Sacred', 'Choral', 'Requiem', 'Oratorio', 'Spiritual']],
        [['classical piano', 'piano'], ['Piano', 'Keyboard', 'Player Piano']],
        [['organ'], ['Organ']],
        [['classical guitar'], ['Guitar', 'Lute']],
        [['chamber music'], ['Violin', 'Cello', 'Flute', 'Chamber', 'Concerto']],
        [['symphonic', 'orchestral'], ['Orchestral', 'Symphony', 'Ballet']],
        [['contemporary classical', 'new music', 'avant-garde'], ['Modernist', 'Modern', 'Contemporary', 'Avant-Garde', 'Experimental', 'Serialism', 'Atonal', 'Second Viennese School', 'Darmstadt', 'Spectral', 'Complexity', 'Postmodern', 'Polystylism', 'Neoclassical', 'Impressionism', 'Les Six', 'Electronic']],
        [['minimalism', 'contemporary classical'], ['Minimalism', 'Postminimalism', 'Repetitive', 'Drone']],
        [['soundtrack', 'film music'], ['Film']],
        [['jazz'], ['Jazz', 'Smooth']],
        [['tango'], ['Tango']],
        [['folk'], ['Folk', 'Americana']],
        [['classical crossover'], ['Crossover']],
        [['musicals', 'broadway'], ['Theatre']],
    ]) for (const t of ourTags) RADIO_TAGS[t] = radioTags;
    const RADIO_FALLBACK_TAG = 'classical';
    const RADIO_FALLBACK_HOSTS = ['de1.api.radio-browser.info', 'nl1.api.radio-browser.info', 'at1.api.radio-browser.info', 'fi1.api.radio-browser.info'];
    let radioHosts = null;          // resolved server list, best first
    const recentStations = [];      // uuids, so "next station" doesn't repeat itself

    // Radio tags to try, most specific first: the chosen tag, else the artist's style tags; always ends in "classical"
    function radioTagsFor(node, tag) {
        const ours = tag ? [tag] : (node?.tags || []);
        const out = [];
        for (const t of ours) for (const r of (RADIO_TAGS[t] || [])) if (!out.includes(r)) out.push(r);
        return [...out.slice(0, 3), RADIO_FALLBACK_TAG].filter((t, i, a) => a.indexOf(t) === i);
    }

    // Radio Browser asks clients to pick a server from its live list rather than hard-coding one
    async function getRadioHosts() {
        if (radioHosts) return radioHosts;
        let names = [];
        try {
            const servers = await fetchJson('https://all.api.radio-browser.info/json/servers');
            names = [...new Set((servers || []).map(s => s?.name).filter(Boolean))];
        } catch (e) { console.warn('[radio] server list unavailable, using defaults', e); }
        radioHosts = shuffled(names.length ? names : RADIO_FALLBACK_HOSTS);
        return radioHosts;
    }

    async function radioApi(path) {
        let lastErr;
        for (const host of await getRadioHosts()) {
            try { return await fetchJson(`https://${host}${path}`); }
            catch (e) { lastErr = e; radioHosts = [...radioHosts.filter(h => h !== host), host]; } // demote failing host
        }
        throw lastErr || new Error('no radio servers');
    }

    function isPlayableStation(st) {
        const url = st?.url_resolved || '';
        if (!url.startsWith('https://')) return false;   // page only allows https media
        if (Number(st.hls) === 1 || /\.m3u8(\?|$)/i.test(url)) return false; // HLS needs an extra player library
        if (st.lastcheckok !== undefined && Number(st.lastcheckok) !== 1) return false;
        return true;
    }

    const stationCache = new Map(); // radio tag -> playable stations (most-voted first)

    async function stationsFor(radioTag) {
        if (!stationCache.has(radioTag)) {
            const params = new URLSearchParams({ tag: radioTag, tagExact: 'true', hidebroken: 'true', order: 'votes', reverse: 'true', limit: '100' });
            const stations = (await radioApi(`/json/stations/search?${params}`) || []).filter(isPlayableStation);
            stationCache.set(radioTag, stations.slice(0, 25)); // most-voted, a little variety
        }
        return stationCache.get(radioTag);
    }

    async function playRadio(node, tag, token = ++playToken) {
        const isCurrent = () => token === playToken;
        clearTimeout(skipTimer);
        const trackDisplay = document.getElementById('track-title');
        // First look for a station not played recently in any of the genres; only then allow repeats
        const attempts = radioTagsFor(node, tag).flatMap(t => [[t, false]]);
        attempts.push(...attempts.map(([t]) => [t, true]));
        for (const [radioTag, allowRecent] of attempts) {
            trackDisplay.innerText = `Tuning in: ${radioTag} radio...`;
            try {
                const stations = await stationsFor(radioTag);
                if (!isCurrent()) return;
                const pool = allowRecent ? stations : stations.filter(x => !recentStations.includes(x.stationuuid));
                if (!pool.length) continue;
                const st = pool[Math.floor(Math.random() * pool.length)];
                recentStations.push(st.stationuuid);
                if (recentStations.length > 15) recentStations.shift();
                const where = [st.country, st.codec && `${st.codec}${st.bitrate ? ' ' + st.bitrate + ' kbps' : ''}`].filter(Boolean).join(' · ');
                startTrack(node || { id: 'Radio' }, {
                    src: st.url_resolved,
                    title: `${String(st.name || 'Unnamed station').trim()}${where ? ' (' + where + ')' : ''}`,
                    label: `Radio · ${radioTag}`,
                }, node ? `${node.id} — ` : '');
                // Lets Radio Browser count the play for its popularity ranking
                radioApi(`/json/url/${encodeURIComponent(st.stationuuid)}`).catch(() => {});
                return;
            } catch (e) {
                if (!isCurrent()) return;
                console.warn('[radio]', radioTag, e);
            }
        }
        if (!isCurrent()) return;
        handlePlaybackFailure('No radio station found.');
    }

    // --- Relatedness ("similarity") & weighted sampling ---
    // How related two artists are (0-1), from three kinds of evidence:
    //   direct – documented links from relations.json: teacher/student, influence, family, performed,
    //            collaborated, listened to by the same people, named on the same recordings
    //   style  – shared context (school, movement, ensemble, voice, instrument, genre, country) and
    //            shared tags; rare things count more than common ones (IDF weighting)
    //   era    – closeness in time. It scales style only: a teacher can be 40 years older.
    // Tune the weights here; relations.json doesn't need rebuilding.
    const RELATEDNESS = {
        direct: { teacher: 1.0, family: 0.9, influence: 0.8, performed: 0.7, collab: 0.6, listen: 0.7, cooccur: 0.6 },
        context: { school: 0.6, movement: 0.5, member: 0.45, voice: 0.25, genre: 0.25, instrument: 0.2, country: 0.15, type: 0.1 },
        directWeight: 0.9,   // how much a documented link counts
        contextWeight: 0.6,  // how much shared context counts
        tagWeight: 0.6,      // how much shared tags count
        eraSigma: 60,        // years; artists this far apart keep ~60% of their style similarity
        eraFloor: 0.3,       // style still counts this much between artists centuries apart
    };
    // Tags that describe a style or period read as "both Baroque"; the rest as "both known for Opera"
    const STYLE_TAGS = new Set(['Medieval', 'Renaissance', 'Baroque', 'Early Baroque', 'Classical', 'Romantic', 'Late Romantic',
        'Modernist', 'Modern', 'Contemporary', 'Avant-Garde', 'Minimalism', 'Postminimalism', 'Impressionism', 'Neoclassical',
        'Serialism', 'Nationalist', 'Verismo', 'Bel Canto', 'Experimental', 'Spectral', 'Atonal', 'Polystylism', 'Postmodern',
        'Early Music', 'Historically Informed', 'Jazz', 'Folk', 'Crossover', 'Electronic']);
    let relationEdges = new Map(); // "a||b" -> { s: {signal: 0-1}, why: [...] }

    function edgeKey(a, b) { return a < b ? a + '||' + b : b + '||' + a; }

    // relations.json is optional: without it, relatedness uses tags, context and era only
    async function loadRelations(filename) {
        try {
            const res = await fetch(filename, { cache: 'no-store' });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            relationEdges = new Map();
            for (const e of (Array.isArray(data?.edges) ? data.edges : [])) {
                if (nodeById.has(e.a) && nodeById.has(e.b) && e.s) relationEdges.set(edgeKey(e.a, e.b), e);
            }
            return data;
        } catch (e) {
            console.warn(`[relations] ${filename} not loaded (${e.message}); using tags, context and era only`);
            relationEdges = new Map();
            return null;
        }
    }

    // Precompute each artist's weighted context and tags (IDF: shared by few artists = more telling)
    function prepareRelatedness() {
        const N = nodes.length;
        const idf = df => (N > 1 && df < N) ? Math.log(N / df) / Math.log(N) : 0;
        const contextOf = n => {
            const a = n.attrs || {};
            const out = [];
            const add = (type, values) => { for (const v of (values || [])) if (v) out.push([type, String(v)]); };
            add('school', n.meta?.schools); add('movement', a.movement); add('member', a.member);
            add('voice', a.voice); add('genre', a.genre); add('instrument', a.instrument);
            add('country', [...new Set([...(n.meta?.regions || []), ...(a.country || [])])]);
            add('type', [n.type]);
            return out;
        };
        const ctxDf = new Map(), tagDf = new Map();
        for (const n of nodes) {
            n._ctxRaw = contextOf(n);
            for (const k of new Set(n._ctxRaw.map(([t, v]) => t + ':' + v))) ctxDf.set(k, (ctxDf.get(k) || 0) + 1);
            n._tagList = [...new Set((n.tags || []).filter(t => !NON_MUSICAL_TAGS.has(t)))];
            for (const t of n._tagList) tagDf.set(t, (tagDf.get(t) || 0) + 1);
        }
        for (const n of nodes) {
            n._ctx = new Map(); // "type:value" -> { type, value, w }
            for (const [type, value] of n._ctxRaw) {
                const k = type + ':' + value;
                n._ctx.set(k, { type, value, w: (RELATEDNESS.context[type] || 0) * idf(ctxDf.get(k)) });
            }
            n._tagW = new Map(n._tagList.map(t => [t, idf(tagDf.get(t))]));
            n._tagSum = [...n._tagW.values()].reduce((a, b) => a + b, 0);
            delete n._ctxRaw;
        }
    }

    function directScore(u, v) {
        const e = relationEdges.get(edgeKey(u.id, v.id));
        if (!e) return 0;
        let keep = 1;
        for (const [sig, val] of Object.entries(e.s)) keep *= 1 - (RELATEDNESS.direct[sig] || 0) * Math.max(0, Math.min(1, +val || 0));
        return 1 - keep;
    }

    function styleScore(u, v) {
        let keep = 1;
        for (const [k, c] of u._ctx || []) if (v._ctx?.has(k)) keep *= 1 - c.w;
        const context = 1 - keep;
        let shared = 0;
        for (const [t, w] of u._tagW || []) if (v._tagW?.has(t)) shared += w;
        // shared weight relative to both artists' tag weight (geometric mean): one-off tags dilute less
        const denom = Math.sqrt((u._tagSum || 0) * (v._tagSum || 0));
        const tags = denom > 0 ? Math.min(1, shared / denom) : 0;
        return 1 - (1 - RELATEDNESS.contextWeight * context) * (1 - RELATEDNESS.tagWeight * tags);
    }

    function eraCloseness(u, v) {
        const d = (Number.isFinite(u.era) ? u.era : 1800) - (Number.isFinite(v.era) ? v.era : 1800);
        return Math.exp(-(d * d) / (2 * RELATEDNESS.eraSigma * RELATEDNESS.eraSigma));
    }

    // Relatedness of two artists, 0-1 (used by every mode, the neighbour lists and the map links)
    function similarity(u, v) {
        if (!u || !v || u.id === v.id) return 0;
        const era = RELATEDNESS.eraFloor + (1 - RELATEDNESS.eraFloor) * eraCloseness(u, v);
        return 1 - (1 - RELATEDNESS.directWeight * directScore(u, v)) * (1 - styleScore(u, v) * era);
    }

    // The same without the time factor: positions artists vertically (time is already the x axis)
    function styleRelatedness(u, v) {
        if (!u || !v || u.id === v.id) return 0;
        return 1 - (1 - RELATEDNESS.directWeight * directScore(u, v)) * (1 - styleScore(u, v));
    }

    // Human-readable reasons why v is related to u, strongest first
    function explain(u, v, max = 3) {
        if (!u || !v || u.id === v.id) return [];
        const reasons = [];
        const e = relationEdges.get(edgeKey(u.id, v.id));
        if (e) {
            const d = directScore(u, v);
            (e.why || []).forEach((text, i) => reasons.push({ text, w: 1 + d - i * 0.01 }));
        }
        const said = new Set();
        for (const [k, c] of u._ctx || []) {
            if (!v._ctx?.has(k) || c.type === 'type' || c.w < 0.02) continue;
            const text = c.type === 'member' ? `both associated with ${c.value}`
                : c.type === 'voice' ? `both ${c.value}s`
                : c.type === 'instrument' ? `both play ${c.value}`
                : c.type === 'genre' ? `both in ${c.value}`
                : `both ${c.value}`;
            said.add(c.value.toLowerCase());
            reasons.push({ text, w: c.w * RELATEDNESS.contextWeight });
        }
        for (const [t, w] of u._tagW || []) {
            const tl = t.toLowerCase();
            if (!v._tagW?.has(t) || w < 0.05 || [...said].some(x => x === tl || x.startsWith(tl + ' '))) continue;
            reasons.push({ text: STYLE_TAGS.has(t) ? `both ${t}` : `both known for ${t}`, w: w * RELATEDNESS.tagWeight * 0.5 });
        }
        if (Number.isFinite(u.era) && Number.isFinite(v.era) && Math.abs(u.era - v.era) <= 20) {
            reasons.push({ text: 'contemporaries', w: 0.05 });
        }
        reasons.sort((a, b) => b.w - a.w);
        return [...new Set(reasons.map(r => r.text))].slice(0, max);
    }

    // ---------- Taste ----------
    // Learns only from what you do on purpose: the ♥ button, skipping a track in its first 30 seconds,
    // and listening (2 minutes, or to the end of a shorter track). Automatic skips (no recordings found,
    // a file that won't play) never count, and neither does Radio. Each artist's score also spreads,
    // at half strength, to their closest artists, so liking Pérotin makes Léonin likelier too.
    // The score multiplies the pick weight (like = 2.2x, three quick skips = 0.5x): nothing is ruled out.
    const TASTE = {
        like: 1.0, listen: 0.1, maxListens: 4, skip: -0.3, maxSkips: 3,
        quickSkipSec: 30, listenSec: 120, spread: 0.5, strength: 0.8,
    };
    const TASTE_KEY = 'mg_taste';
    let taste = { on: true, artists: {} };  // artists: id -> { like, listens, skips }
    let tasteSpread = new Map();             // id -> taste borrowed from related artists
    let trackState = null;                   // the track playing now: { node, started, counted }

    function loadTaste() {
        try {
            const saved = JSON.parse(localStorage.getItem(TASTE_KEY) || 'null');
            if (saved && saved.artists && typeof saved.artists === 'object') {
                taste.on = saved.on !== false;
                // Saved under an old name (merged entry)? File it under the current id
                for (const [id, t] of Object.entries(saved.artists)) {
                    const n = resolveNode(id);
                    if (n) taste.artists[n.id] = { ...(taste.artists[n.id] || {}), ...t };
                }
            }
        } catch (e) { console.warn('[taste] load', e); }
        tasteChanged(false);
    }

    function tasteChanged(save = true) {
        if (save) { try { localStorage.setItem(TASTE_KEY, JSON.stringify(taste)); } catch (e) {} }
        tasteSpread = new Map();
        for (const id of Object.keys(taste.artists)) {
            const own = ownTaste(id);
            if (!own) continue;
            for (const { node: m, sim } of nodeById.get(id)?._neighbours || []) {
                tasteSpread.set(m.id, (tasteSpread.get(m.id) || 0) + sim * own);
            }
        }
        d3.selectAll('.tag-node').text(d => taste.artists[d.id]?.like ? `${d.id} ♥` : d.id);
        updateTasteUI();
        updateVisibility();
    }

    function ownTaste(id) {
        const t = taste.artists[id];
        if (!t) return 0;
        return (t.like ? TASTE.like : 0)
            + TASTE.listen * Math.min(t.listens || 0, TASTE.maxListens)
            + TASTE.skip * Math.min(t.skips || 0, TASTE.maxSkips);
    }

    function affinity(n) {
        const a = ownTaste(n.id) + TASTE.spread * (tasteSpread.get(n.id) || 0);
        return Math.max(-1.5, Math.min(2, a));
    }

    function tasteWeight(n) {
        return taste.on ? Math.exp(TASTE.strength * affinity(n)) : 1;
    }

    function likedNodes() {
        return Object.keys(taste.artists).filter(id => taste.artists[id].like).map(id => nodeById.get(id)).filter(Boolean);
    }

    function recordTaste(node, field) {
        if (!node || !nodeById.has(node.id)) return;
        const t = taste.artists[node.id] || (taste.artists[node.id] = { like: false, listens: 0, skips: 0 });
        t[field] = (t[field] || 0) + 1;
        tasteChanged();
    }

    // A track counts as listened to once: after 2 minutes, or at its end
    function countListen() {
        if (!trackState?.started || trackState.counted) return;
        trackState.counted = true;
        recordTaste(trackState.node, 'listens');
    }

    function toggleLike() {
        if (!currentNode || playMode === 'radio' || !nodeById.has(currentNode.id)) return;
        const t = taste.artists[currentNode.id] || (taste.artists[currentNode.id] = { like: false, listens: 0, skips: 0 });
        t.like = !t.like;
        if (t.like) t.skips = 0; // a like overrules earlier quick skips
        if (trackState?.node === currentNode) trackState.counted = true; // and a skip right after it says nothing
        tasteChanged();
    }

    function toggleTaste() {
        taste.on = !taste.on;
        tasteChanged();
    }

    function resetTaste() {
        if (!confirm('Forget all your likes, skips and listens?')) return;
        taste.artists = {};
        tasteChanged();
    }

    // For the "why" line: is this pick (partly) down to your likes?
    function tasteReason(node) {
        if (!taste.on) return '';
        if (taste.artists[node.id]?.like) return '♥ you liked them';
        let best = null;
        for (const u of likedNodes()) {
            const hit = (u._neighbours || []).find(x => x.node === node);
            if (hit && (!best || hit.sim > best.sim)) best = { u, sim: hit.sim };
        }
        return best ? `♥ close to ${best.u.id}, whom you liked` : '';
    }

    function updateTasteUI() {
        const btn = document.getElementById('like-btn');
        if (btn) {
            const liked = !!(currentNode && taste.artists[currentNode.id]?.like);
            btn.textContent = liked ? '♥ Liked' : '♡ Like';
            btn.classList.toggle('liked', liked);
            btn.disabled = !currentNode || playMode === 'radio' || !nodeById.has(currentNode.id);
        }
        const tb = document.getElementById('taste-btn');
        if (tb) tb.textContent = taste.on ? 'Taste: ON' : 'Taste: OFF';
        const line = document.getElementById('taste-line');
        if (line) {
            const all = Object.values(taste.artists);
            const liked = all.filter(t => t.like).length;
            const skipped = all.filter(t => (t.skips || 0) > 0).length;
            const listened = all.filter(t => (t.listens || 0) > 0).length;
            line.textContent = all.length
                ? `Taste: ${liked} liked · ${listened} listened to · ${skipped} skipped early`
                : 'Taste: like artists (♡) or skip early to steer the picks';
            if (all.length) {
                const reset = document.createElement('button');
                reset.className = 'link-btn';
                reset.textContent = 'reset';
                reset.onclick = resetTaste;
                line.appendChild(reset);
            }
        }
    }

    const RECENT_EXCLUDED = 8;   // the last 8 artists played are never picked again straight away
    const recentPicks = [];

    function baseWeight(candidate) {
        if (recentPicks.includes(candidate.id)) return 0;
        const role = candidate.is_master ? ROLE_MASTER_W : 1.0;
        const p = plays.get(candidate.id) || 0;
        const novelty = 1 / Math.sqrt(1 + p);
        const last = lastPlayedAt.get(candidate.id);
        const dt = (typeof last === 'number') ? (Date.now() - last) : Infinity;
        // 0.002 right after playing (500x less likely: a very similar artist would otherwise come
        // straight back), 0.5 after one half-life, approaching 1 later
        const recency = Math.max(0.002, 1 - Math.pow(2, -dt / RECENCY_HALF_LIFE_MS));
        return role * novelty * recency * tasteWeight(candidate);
    }

    // Pick one item with probability proportional to exp(score / tau) * baseWeight(item).
    // score is the musical part (similarity etc., roughly 0-1) and is sharpened by the temperature;
    // baseWeight (master role, play count, recency) is a plain multiplier, so a master is 1.6x as
    // likely rather than the ~50x it was when it was divided by tau as well.
    function softmaxPick(items, scoreFn, tau=TAU) {
        const scored = [];
        for (const it of items) {
            const s = scoreFn(it);
            const w = baseWeight(it);
            if (!Number.isFinite(s) || !(w > 0)) continue;
            scored.push({ it, logw: s / tau + Math.log(w) });
        }
        if (scored.length === 0) return null;
        // Keep top-K for speed; subtract the max for numerical stability
        scored.sort((a, b) => b.logw - a.logw);
        const top = scored.slice(0, 60);
        const ws = top.map(o => Math.exp(o.logw - top[0].logw));
        const Z = ws.reduce((a, b) => a + b, 0);
        let r = Math.random() * Z;
        for (let i = 0; i < top.length; i++) {
            r -= ws[i];
            if (r <= 0) return top[i].it;
        }
        return top[top.length - 1].it;
    }

    function similarCandidates(node) {
        return (node?._neighbours || []).map(x => x.node);
    }

    function pickNextPureRandom() {
        // Any artist except the ones just played (unless there's nothing else)
        const pool = nodes.filter(n => !recentPicks.includes(n.id));
        const from = pool.length ? pool : nodes;
        return from[Math.floor(Math.random() * from.length)];
    }

    function pickNextRandomWalk() {
        const rel = similarCandidates(currentNode);
        // Add a small random sample to allow drift
        const sample = [];
        for (let i = 0; i < 40; i++) sample.push(nodes[Math.floor(Math.random() * nodes.length)]);
        const pool = Array.from(new Set([...rel, ...sample]));
        return softmaxPick(pool, (c) => similarity(currentNode, c));
    }

    function withinTagName() {
        return activeTag || (currentNode?.tags || []).find(t => !NON_MUSICAL_TAGS.has(t)) || null;
    }

    function pickNextWithinTag() {
        const tag = withinTagName();
        if (!tag) return pickNextRandomWalk();
        const pool = nodes.filter(n => Array.isArray(n.tags) && n.tags.includes(tag));
        // If tag pool is too small, add the most similar artists
        const candidates = (pool.length >= 10) ? pool : Array.from(new Set([...pool, ...similarCandidates(currentNode)]));
        return softmaxPick(candidates, (c) => similarity(currentNode, c));
    }

    let spiralTarget = null;

    function pickNextSpiralTime() {
        const curEra = Number.isFinite(currentNode?.era) ? currentNode.era : 1800;
        const target = curEra + spiralDir * 25;
        // Bounce direction at edges
        if (target < 1100) spiralDir = +1;
        if (target > 2025) spiralDir = -1;
        const t = curEra + spiralDir * 25;
        spiralTarget = t;
        return softmaxPick(nodes, (c) => {
            const sim = similarity(currentNode, c);
            const ce = Number.isFinite(c?.era) ? c.era : 1800;
            const eraPenalty = Math.abs(ce - t) / 150; // coarse guidance
            return sim - eraPenalty;
        });
    }

    function pickTeleport() {
        // Pick something far (low similarity) but not overplayed.
        const sample = [];
        for (let i = 0; i < 180; i++) sample.push(nodes[Math.floor(Math.random() * nodes.length)]);
        return softmaxPick(sample, (c) => {
            const sim = similarity(currentNode, c);
            return 1 - sim; // far away
        }, 0.18);
    }

    function autoNext() {
        if (playMode === 'radio') { playRadio(currentNode, activeTag); return; }
        if (!currentNode) return;

        let next = null;
        const from = currentNode;
        let reason = { mode: playMode === 'teleport' ? 'teleport' : playMode, from };
        if (playMode === 'pure_random') next = pickNextPureRandom();
        else if (playMode === 'within_tag') { reason.tag = withinTagName(); next = pickNextWithinTag(); if (!reason.tag) reason.mode = 'random_walk'; }
        else if (playMode === 'spiral_time') { next = pickNextSpiralTime(); reason.target = spiralTarget; }
        else if (playMode === 'teleport') {
            next = pickTeleport();
            // One-shot: go back to the mode that was active before the jump
            playMode = modeBeforeTeleport || 'random_walk';
            updateUI();
            saveState();
        }
        else { reason.mode = 'random_walk'; next = pickNextRandomWalk(); }

        if (!next) { next = pickNextPureRandom(); reason = { mode: 'pure_random', from }; }
        playNode(next, reason);
    }

    // Persist playback position (for Resume)
    (function(){
        if (!player) return;
        let lastWrite = 0;
        player.addEventListener('timeupdate', () => {
            const now = Date.now();
            if (now - lastWrite < 1500) return;
            lastWrite = now;
            try { localStorage.setItem(LS.lastTrackTime, String(player.currentTime || 0)); } catch(e) {}
        });
        player.addEventListener('timeupdate', () => {
            if (player.currentTime >= TASTE.listenSec) countListen();
        });
    })();

    // Autoplay: play next when track ends
    player.addEventListener('ended', () => {
        countListen();
        if (autoplayEnabled) autoNext();
    });

    // A track that actually starts playing resets the failure streak
    player.addEventListener('playing', () => {
        consecutiveFailures = 0;
        if (trackState) trackState.started = true;
    });

    // Broken/unsupported file: move on instead of stalling
    player.addEventListener('error', () => {
        if (!player.getAttribute('src')) return;
        console.warn('[audio] error', player.error);
        handlePlaybackFailure('Could not play this file.');
    });

    init();
</script>
</body>
